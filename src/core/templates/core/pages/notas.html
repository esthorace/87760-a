{% extends 'core/base.html' %}
{% block contenido %}
    <h1>Notas</h1>
    {% for nota in notas %}
        {% if nota > 6 %}
            <p style="color: green;">Aprobado: {{ nota }}</p>
        {% else %}
            <p style="color: red">Desaprobado: {{ nota }}</p>
        {% endif %}
    {% endfor %}
    <button><a href="{% url 'core:home' %}">Home</a></button>
{% endblock %}
