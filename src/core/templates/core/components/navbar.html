<header class="nav-wrap">
    <div class="container">
        <nav aria-label="Navegación principal">
            <a class="brand" href="#inicio" aria-label="La Esquina, inicio">
                <span class="brand-mark">🧺</span>
                <span>La Esquina</span>
            </a>
            <ul class="nav-links">
                <li><a href="#productos">Productos</a></li>
                <li><a href="#por-que">La despensa</a></li>
                <li><a href="#contacto">Contacto</a></li>
                {% if user.is_authenticated %}
                    <li><a href="{% url 'producto:home' %}">Ventas</a></li>
                    <li><a href="#">{{ user.username }}</a></li>
                    <li>
                        <form action="{% url 'core:logout' %}" method="post">
                            {% csrf_token %}
                            <button class="nav-logout" type="submit">Logout</button>
                        </form>
                    </li>
                {% else %}
                    <li><a class="nav-login" href="{% url 'core:login' %}">Acceder</a></li>
                {% endif %}
            </ul>
        </nav>
    </div>
</header>
