{% extends "core/base.html" %}

{% block contenido %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="display-5 mb-3">🗑️</div>
                        <h1 class="h3 fw-bold mb-1" style="color: var(--ink);">Eliminar categoría</h1>
                        <p class="text-muted mb-0" style="color: var(--ink-soft) !important;">Esta acción no se puede deshacer</p>
                    </div>

                    <div class="alert alert-danger rounded-3" role="alert">
                        ¿Estás seguro de eliminar <strong>"{{ categoria }}"</strong>?
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger btn-lg fw-semibold rounded-3 py-2">Sí, eliminar</button>
                            <a href="{% url 'producto:categoria_list' %}" class="btn btn-outline-secondary btn-lg fw-semibold rounded-3 py-2"
                               style="border-color: var(--line); color: var(--ink);">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock contenido %}
