{% extends "core/base.html" %}

{% block contenido %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="eyebrow">Detalle</div>
                        <h1 class="h3 fw-bold mb-1" style="color: var(--ink);">Venta</h1>
                        <p class="text-muted mb-0" style="color: var(--ink-soft) !important;">Información completa</p>
                    </div>

                    <dl class="row mb-0 detail-list">
                        <dt class="col-sm-4">Vendedor</dt>
                        <dd class="col-sm-8">{{ venta.vendedor.user.username }}</dd>
                        <dt class="col-sm-4">Producto</dt>
                        <dd class="col-sm-8">{{ venta.producto }}</dd>
                        <dt class="col-sm-4">Cantidad</dt>
                        <dd class="col-sm-8">{{ venta.cantidad }}</dd>
                        <dt class="col-sm-4">Fecha</dt>
                        <dd class="col-sm-8">{{ venta.fecha }}</dd>
                    </dl>

                    <div class="d-grid gap-2 mt-4">
                        <a href="{% url 'producto:venta_list' %}" class="btn btn-outline-secondary btn-lg fw-semibold rounded-3 py-2"
                           style="border-color: var(--line); color: var(--ink);">← Volver</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock contenido %}
